<!DOCTYPE html>
<html>
    <head>
        <title>Deck Saver</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js" integrity="sha512-a+SUDuwNzXDvz4XrIcXHuCf089/iJAoN4lmrXJg18XnduKK6YlDHNRalv4yd1N40OKI80tFidF+rqTFKGPoWFQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="/scripts/hash.js"></script>
        <script src="/scripts/auth.js"></script>
        <script src="/scripts/index.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
    </head>
    <body>
        <center>
            <br/><br/>
            <h1>Deck Saver</h1>
            <br/><br/><br/>
            <form id="upload" enctype="multipart/form-data">
                <input type="file" class="form-control" id="files" multiple accept=".ydk" style="margin-bottom: 10px" />
                <button class="btn btn-primary" type="button" id="submit">
                    <span id="submit_spin" style="display: none;" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    <span id="submit_text" class="sr-only">Upload</span>
                </button>
            </form>
            <br/><br/><br/>
            <div id="result" class="list-group" style="display: none;"></div>
        </center>
    </body>
</html>
