<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeckSaver | Offline Demo</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#111827;color:#eff6ff}
body{max-width:850px;margin:auto;padding:30px 20px}textarea{box-sizing:border-box;width:100%;height:260px;padding:16px;border:1px solid #526578;border-radius:10px;background:#202e43;color:inherit;font:16px/1.5 monospace}button{margin:14px 10px 14px 0;padding:10px 22px;border:0;border-radius:8px;background:#8cc7fb;color:#132439;font-size:1rem}pre{white-space:pre-wrap;background:#202e43;padding:18px;border-radius:10px}
</style>
<h1>Yu-Gi-Oh! DeckSaver</h1><p>Offline YDK deck preview. Paste a deck list, check IDs and download the edited YDK file.</p>
<label for="ydk">YDK list</label><textarea id="ydk">#main
89631139
46986414
#extra
84013237
!side
89631139</textarea>
<div><button id="parse">Preview</button><button id="save">Save YDK</button></div>
<pre id="output" aria-live="polite">No deck loaded.</pre>
<p>This local demo does not collect credentials, upload saved decks, or contact card APIs.</p>
<script>
const input=document.getElementById('ydk'),out=document.getElementById('output');
document.getElementById('parse').onclick=async()=>{
 try{
  const r=await fetch('/api/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ydk:input.value})});
  const data=await r.json();
  out.textContent=r.ok?JSON.stringify(data,null,2):'Error: '+data.error;
 }catch(e){out.textContent='Could not parse deck: '+e.message;}
};
document.getElementById('save').onclick=()=>{
 const blob=new Blob([input.value],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='my-deck.ydk';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
</script></html>
